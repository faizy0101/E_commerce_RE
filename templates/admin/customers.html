{% extends 'admin/admin_base.html' %}
{% block content %}


    <table class="table table-dark">
  <thead>
    <tr>
      <th scope="col">No.</th>
      <th scope="col">Name</th>
        <th scope="col">Email</th>
        <th scope="col">Phone</th>
        <th scope="col">Pincode</th>
        <th scope="col">Address</th>
      <th scope="col" colspan="2">Actions</th>
    </tr>
  </thead>
  <tbody>
  {% for i in customers%}
    <tr>
      <td>{{forloop.counter}}</td>
      <td>{{i.name}}</td>
        <td>{{i.email}}</td>
        <td>{{i.phone}}</td>
        <td>{{i.pincode}}</td>
        <td>{{i.address}}</td>
      <td><td><a class="btn btn-info" href="{% url 'update_customers' i.id %}" type="button">Update</a></td>
                <td><a class="btn btn-danger" href="{% url 'delete_customers' i.id %}" type="button">Delete</a></td>
            </td>
    </tr>
{% endfor %}
  </tbody>
</table>
{% endblock %}
